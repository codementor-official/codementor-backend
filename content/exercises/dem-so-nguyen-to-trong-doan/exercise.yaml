title: Đếm số nguyên tố trong đoạn
difficulty: medium
summary: Tách logic thành hàm và tối ưu từ thử chia lên sàng Eratosthenes để trả lời nhiều truy vấn trên đoạn [a, b].
tags: [python, vong-lap]
xp: 35
minutes: 30
timeLimitMs: 3000
constraints:
  - "1 ≤ q ≤ 10^5"
  - "1 ≤ a ≤ b ≤ 10^6"
hints:
  - "Thử chia cho mọi số từ 2 tới √n là đủ đúng, nhưng với 10^5 truy vấn trên đoạn dài thì quá chậm."
  - "Sàng Eratosthenes đánh dấu mọi số nguyên tố ≤ 10^6 trong một lần."
  - "Mảng cộng dồn `prefix[i]` = số nguyên tố ≤ i. Khi đó đáp án mỗi truy vấn là `prefix[b] - prefix[a - 1]`."
examples:
  - input: "2\n1 10\n11 20\n"
    output: "4\n4"
    explanation: "Trong [1, 10] có 2, 3, 5, 7. Trong [11, 20] có 11, 13, 17, 19. Số 1 không phải số nguyên tố."
  - input: "1\n14 16\n"
    output: "0"
    explanation: "14, 15, 16 đều là hợp số."
tests:
  - { input: "1\n1 1\n", visibility: public }
  - { input: "1\n2 2\n", visibility: public }
  - { input: "1\n1 1000000\n", visibility: hidden }
  - { input: "3\n1 2\n999983 999983\n999984 1000000\n", visibility: hidden }
  - { input: "2\n90 96\n97 97\n", visibility: hidden }
  - { input: "1\n500000 600000\n", visibility: hidden }
  - { input: "4\n1 100\n1 1000\n1 10000\n1 100000\n", visibility: hidden }
  - { input: "1\n4 4\n", visibility: hidden }
