title: Đếm cặp có tổng bằng K
difficulty: medium
summary: Từ lời giải O(n²) duyệt mọi cặp tới O(n) bằng hai con trỏ trên mảng đã sắp xếp — bài nhập môn đánh giá độ phức tạp.
tags: [mang, hai-con-tro]
xp: 35
minutes: 30
timeLimitMs: 1000
constraints:
  - "2 ≤ n ≤ 2·10^4"
  - "-10^9 ≤ a[i], K ≤ 10^9"
  - "Mảng đã được sắp xếp không giảm."
hints:
  - "Duyệt mọi cặp (i, j) là n(n-1)/2 phép thử — với n = 2·10^4 là khoảng 200 triệu, chắc chắn quá thời gian."
  - "Đặt con trỏ trái ở đầu, phải ở cuối. Tổng nhỏ hơn K thì tăng trái, lớn hơn K thì giảm phải."
  - "Khi tổng bằng K và a[trái] = a[phải], mọi cặp trong đoạn đều thỏa: có m(m-1)/2 cặp với m là độ dài đoạn. Khi a[trái] ≠ a[phải], đếm số phần tử bằng a[trái] và bằng a[phải] rồi nhân lại."
  - "Kết quả có thể tới khoảng 2·10^8 cặp — vẫn vừa int 32 bit, nhưng hãy tập thói quen dùng 64 bit cho phép đếm."
examples:
  - input: "5 6\n1 2 3 4 5\n"
    output: "2"
    explanation: "Các cặp (1, 5) và (2, 4)."
  - input: "4 4\n2 2 2 2\n"
    output: "6"
    explanation: "Mọi cách chọn 2 trong 4 phần tử bằng 2 đều có tổng 4: 4·3/2 = 6 cặp."
tests:
  - { input: "2 3\n1 2\n", visibility: public }
  - { input: "3 10\n1 2 3\n", visibility: public }
  - { input: "6 0\n-3 -1 0 0 1 3\n", visibility: hidden }
  - { input: "7 5\n1 1 2 3 3 4 4\n", visibility: hidden }
  - { input: "5 2\n1 1 1 1 1\n", visibility: hidden }
  - { input: "4 -2000000000\n-1000000000 -1000000000 0 5\n", visibility: hidden }
  - { input: "6 7\n1 2 3 4 5 6\n", visibility: hidden }
  - { input: "8 8\n4 4 4 4 4 4 4 4\n", visibility: hidden }
  - { file: big-random.txt, visibility: hidden }
  - { file: big-equal.txt, visibility: hidden }
  - { file: big-none.txt, visibility: hidden }
  - { file: big-dense.txt, visibility: hidden }
