  - title: Chuỗi và cấu trúc dữ liệu có sẵn
    description: Xử lý văn bản, lưu nhiều giá trị bằng list, tra cứu nhanh bằng dictionary và set.
    lessons:
      - md: 05-chuoi.md
      - exercise: chuan-hoa-ho-ten
