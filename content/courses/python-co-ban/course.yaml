slug: python-co-ban
title: Python cơ bản
level: none
description: >-
  Khóa nhập môn lập trình bằng Python cho người chưa từng viết code. Bạn đi từ chương trình đầu
  tiên tới biến, điều kiện, vòng lặp, chuỗi, list, dictionary, hàm và module — mỗi chương kết
  thúc bằng một bài tập được chấm tự động. Học xong, bạn đọc hiểu và tự viết được chương trình
  Python vài chục dòng, đủ nền tảng để bước sang Cấu trúc dữ liệu và giải thuật.
prerequisiteNote: Không cần kiến thức lập trình trước. Chỉ cần biết dùng máy tính và trình duyệt.
tags: [python, nhap-mon]
submitNote: Viết lại toàn bộ nội dung khóa học (đợt 1, plan-content-dashboard).
