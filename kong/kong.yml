# Cấu hình declarative cho Kong DB-less. Không có database, không có Admin API ghi —
# muốn đổi thì sửa file này rồi `docker compose restart kong`.
#
# Định tuyến theo TÀI NGUYÊN, không theo tên service. Frontend chỉ biết đúng một
# origin `http://localhost:8000/api/v1` và không cần biết dữ liệu nằm ở service nào.
# Cách này chỉ khả thi vì sở hữu bảng đã sạch: mỗi tài nguyên có đúng một service chủ
# (xem docs/02-service-architecture.md §2). Thêm tài nguyên mới thì thêm path vào đây.
#
# KHÔNG có plugin jwt/oidc ở đây: mỗi service tự xác minh chữ ký token qua JWKS của
# Keycloak. Xác thực hai tầng chỉ tạo thêm một chỗ để lệch cấu hình.
_format_version: "3.0"

services:
  - name: core-service
    url: http://host.docker.internal:3001
    routes:
      - name: core-routes
        paths:
          - /api/v1/me
          - /api/v1/users
          - /api/v1/technologies
          - /api/v1/tags
          - /api/v1/companies
          - /api/v1/announcements
          - /api/v1/audit-logs
        strip_path: false

  - name: learning-service
    url: http://host.docker.internal:3002
    routes:
      - name: learning-routes
        paths:
          - /api/v1/courses
          - /api/v1/chapters
          - /api/v1/lessons
          - /api/v1/roadmaps
          - /api/v1/articles
          # Hoạt động học tập của một tài khoản. KHÔNG đặt dưới `/api/v1/users/:id/activity`
          # được: Kong khớp theo tiền tố, và `/api/v1/users` đã thuộc core-service.
          - /api/v1/activity
        strip_path: false

  - name: exercise-service
    url: http://host.docker.internal:3003
    routes:
      - name: exercise-routes
        paths:
          - /api/v1/exercises
          - /api/v1/exercise-sets
        strip_path: false

  - name: workspace-service
    url: http://host.docker.internal:3004
    read_timeout: 210000
    write_timeout: 210000
    routes:
      - name: workspace-routes
        paths:
          - /api/v1/workspaces
          - /api/v1/groups
        strip_path: false

  - name: submission-service
    url: http://host.docker.internal:3006
    routes:
      - name: submission-routes
        paths:
          - /api/v1/submissions
        strip_path: false

  - name: notification-service
    url: http://host.docker.internal:3012
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false

  - name: recommendation-service
    url: http://host.docker.internal:3013
    routes:
      - name: recommendation-routes
        paths:
          - /api/v1/recommendations
        strip_path: false

  # Judge chạy mã tuỳ ý, và tiến trình của nó giữ socket Docker của host — endpoint này
  # KHÔNG được để công khai. Judge tự kiểm JWT Keycloak trên mọi request (app/auth.py),
  # vì Kong ở đây không có plugin JWT.
  - name: judge-service
    url: http://host.docker.internal:3007
    routes:
      - name: judge-routes
        paths:
          - /api/v1/judge
        strip_path: false

  # ai-service tự kiểm JWT Keycloak trên /api/v1/ai/* (app/auth.py) — Kong ở đây không có
  # plugin JWT. Đường nội bộ /api/v1/internal/* KHÔNG nằm trong route này và vẫn chỉ tới
  # được từ trong mạng Docker bằng shared secret.
  #
  # read_timeout cao vì một lượt agent chạy nhiều bước và giữ kết nối SSE mở suốt run; mặc
  # định 60s sẽ cắt ngang giữa chừng mà không có lỗi nào hiện ra ở client.
  - name: ai-service
    url: http://host.docker.internal:3008
    read_timeout: 300000
    write_timeout: 300000
    routes:
      - name: ai-routes
        paths:
          - /api/v1/ai
        strip_path: false

  # Health của gateway: `/api/v1/health` đi về core. Muốn xem health của service
  # khác thì gọi thẳng cổng của nó — gateway không nên che mất chẩn đoán per-service.
  - name: gateway-health
    url: http://host.docker.internal:3001
    routes:
      - name: gateway-health-route
        paths:
          - /api/v1/health
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        # Dev chạy local, và ba app trên Vercel. Danh sách này và CORS_ORIGINS trong .env
        # phải khớp nhau: Kong trả header CORS cho preflight, còn service trả cho request
        # thật, thiếu một bên thì trình duyệt chặn mà log không thấy lỗi gì.
        - http://localhost:3000
        - http://localhost:3010
        - http://localhost:3011
        - https://codementor.cloud
        - https://lec.codementor.cloud
        - https://admin.codementor.cloud
        # Domain Vercel cấp sẵn. Bản preview mỗi lần deploy lại có domain khác, không
        # nằm trong danh sách này — chỉ ba domain production dưới đây gọi được API.
        - https://codementor-frontend-client.vercel.app
        - https://codementor-frontend-lecturer.vercel.app
        - https://codementor-frontend-admin.vercel.app
      methods: [GET, HEAD, POST, PATCH, PUT, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type, Origin]
      credentials: true
      max_age: 3600

  # Nhìn thấy request đi qua đâu khi debug. Kong trả header này cho mọi response.
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
