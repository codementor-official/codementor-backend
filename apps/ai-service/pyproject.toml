[project]
name = "codementor-ai"
version = "0.1.0"
description = "Internal document-grounded AI service for CodeMentor."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "pymongo>=4.13,<5",
  "boto3>=1.35,<2",
  "openai>=2,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "tiktoken>=0.12,<1",
  # Verify JWT Keycloak cho đường công khai /api/v1/ai/*, y hệt judge-service.
  "pyjwt[crypto]>=2.10,<3",
  # Agent Lecter. `langchain` (không chỉ `langchain-core`) là yêu cầu cứng của
  # ag-ui-langgraph; nó dịch graph LangGraph sang sự kiện AG-UI mà trình duyệt hiểu.
  # Chưa cài langgraph-checkpoint-mongodb: HITL kiểu frontend-tool kết thúc lượt, và
  # client AG-UI gửi lại toàn bộ mảng messages mỗi run, nên MemorySaver là đủ đúng.
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-openai>=1.6,<2",
  "ag-ui-langgraph>=0.0.44,<0.1",
  # Gọi Nest/judge bằng token của chính người dùng. Trước ở dev-dep (chỉ để test).
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is calls in argument defaults; B008 is about mutable
# defaults, which these are not. Same setting as judge-service.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
