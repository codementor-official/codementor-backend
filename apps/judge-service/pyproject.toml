[project]
name = "codementor-judge"
version = "0.1.0"
description = "Chạy và chấm code trong sandbox Docker. Nhận việc qua Kafka hoặc HTTP."
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.12.0",
    "asyncpg>=0.30.0",
    "docker>=7.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "motor>=3.6.0",
    "pyjwt[crypto]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is calls in argument defaults; B008 is about mutable
# defaults, which these are not.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    # Needs a live Docker daemon and the six runner images; `npm run judge:images` first.
    "docker: end-to-end run against real containers",
]

[tool.setuptools.packages.find]
include = ["app*"]
