# Hạ tầng local + các service.
#
# PostgreSQL, MongoDB và Keycloak KHÔNG nằm ở đây — chúng chạy trên EC2
# (13.214.122.227), xem ../codementor-connect.txt. File này chỉ dựng phần hạ tầng
# không có state: Kafka và Kong.
#
#   docker compose up -d kafka kafka-ui kong     # hạ tầng local
#   docker compose up -d                         # thêm các service

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment: &service-env
    NODE_ENV: production
    DATABASE_URL: postgresql://codementor:codementor@host.docker.internal:55432/codementor?schema=public
    MONGO_URI: mongodb://codementor:codementor@host.docker.internal:57017/codementor?authSource=admin
    KAFKA_BROKERS: kafka:29092
    KEYCLOAK_ISSUER: http://keycloak:8080/realms/codementor
    EXERCISE_SERVICE_URL: http://exercise-service:3003
    JUDGE_SERVICE_URL: http://judge-service:3007
    WORKSPACE_SERVICE_URL: http://workspace-service:3004
    AI_SERVICE_URL: http://ai-service:3008
    INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-codementor-local-internal-token}
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  depends_on:
    kafka:
      condition: service_healthy
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- hạ tầng
  kafka:
    # KRaft: không cần ZooKeeper — 1 container thay vì 2, đủ mọi tính năng cần
    # (topic, partition, consumer group, offset). Đổi sang cluster thật chỉ là đổi config.
    image: confluentinc/cp-kafka:7.7.1
    container_name: codementor-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 1 broker nên replication chỉ có thể là 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: codementor-kraft-cluster-1
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'kafka:29092', '--list']
      interval: 10s
      timeout: 10s
      retries: 15

  kong:
    # DB-less: cấu hình nằm ở kong/kong.yml, không cần Postgres riêng cho Kong.
    # Một origin duy nhất cho frontend (:8000) thay vì phải biết cổng từng service.
    image: kong:3.9
    container_name: codementor-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # DB-less thì Admin API chỉ đọc, không cấu hình được gì qua nó. Tắt hẳn cho gọn.
      KONG_ADMIN_LISTEN: 'off'
      KONG_LOG_LEVEL: notice
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    # `network_mode: host` only works on native Linux Docker — Docker Desktop
    # (Windows/Mac) runs the daemon inside a VM, so there is no real host network to
    # join and container creation fails outright. `host.docker.internal` is the
    # portable way to reach the services running on the dev machine; the
    # `host-gateway` extra_hosts entry makes that name resolve on Linux too, where
    # it isn't provided automatically the way it is on Desktop.
    #
    # Lên EC2 thì các service sẽ là container cùng compose network, lúc đó dùng bridge
    # và upstream trỏ theo tên service — kong.yml của môi trường đó sẽ khác file này.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8000:8000'
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-ui:
    # Xem topic, message, consumer lag. Rất đáng có lúc debug luồng bất đồng bộ và lúc demo.
    image: provectuslabs/kafka-ui:latest
    container_name: codementor-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: codementor
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - '8081:8080'
    depends_on:
      kafka:
        condition: service_healthy

  # --------------------------------------------------------- dự phòng offline
  # Keycloak thật chạy trên EC2 (13.214.122.227:8080) và giữ realm `codementor` cùng
  # toàn bộ tài khoản. Hai service dưới đây CHỈ để dựng một stack hoàn toàn offline khi
  # mất mạng; bật chúng lên thì phải đổi KEYCLOAK_ISSUER trong .env, và realm sẽ trống.
  keycloak-db:
    image: postgres:18-alpine
    container_name: codementor-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      # Keycloak dùng database RIÊNG — nhà cung cấp danh tính không đọc bảng nghiệp vụ.
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      retries: 20

  # LƯU Ý: `identityProviders` phải là mảng thật, và file realm KHÔNG được chứa khoá lạ
  # (kiểu `_comment_...`) — Keycloak 26.4 từ chối import cả file vì một khoá không nhận ra,
  # và container chết ngay lúc khởi động chứ không bỏ qua.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: codementor-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-codementor.json:/opt/keycloak/data/import/realm-codementor.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  # ------------------------------------------------------------- service công khai
  core-service:
    <<: *service-base
    container_name: codementor-core
    command: ['node', 'dist/apps/core-service/apps/core-service/src/main.js']
    ports: ['3001:3001']

  learning-service:
    <<: *service-base
    container_name: codementor-learning
    command: ['node', 'dist/apps/learning-service/apps/learning-service/src/main.js']
    ports: ['3002:3002']

  exercise-service:
    <<: *service-base
    container_name: codementor-exercise
    command: ['node', 'dist/apps/exercise-service/apps/exercise-service/src/main.js']
    ports: ['3003:3003']

  workspace-service:
    <<: *service-base
    container_name: codementor-workspace
    command: ['node', 'dist/apps/workspace-service/apps/workspace-service/src/main.js']
    ports: ['3004:3004']

  submission-service:
    <<: *service-base
    container_name: codementor-submission
    command: ['node', 'dist/apps/submission-service/apps/submission-service/src/main.js']
    ports: ['3006:3006']

  realtime-service:
    <<: *service-base
    container_name: codementor-realtime
    command: ['node', 'dist/apps/realtime-service/apps/realtime-service/src/main.js']
    ports: ['3009:3009']

  # Chỉ đọc PostgreSQL, không nghe Kafka — nhưng vẫn dùng `service-base` chung để khỏi có
  # một biến thể cấu hình riêng phải bảo trì.
  recommendation-service:
    <<: *service-base
    container_name: codementor-recommendation
    command: ['node', 'dist/apps/recommendation-service/apps/recommendation-service/src/main.js']
    ports: ['3013:3013']

  # -------------------------------------------------------------- service nội bộ
  # Không map cổng ra ngoài: chỉ nhận việc qua Kafka, frontend không gọi trực tiếp.
  # Python/FastAPI, không dùng image Node chung. Chấm bài bằng cách nói chuyện với Docker
  # daemon của host (Docker-out-of-Docker), nên phải mount socket vào — đó là quyền tương
  # đương root trên host, xem apps/judge-service/README.md §Bảo mật.
  judge-service:
    build:
      context: ./apps/judge-service
    container_name: codementor-judge
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ['3007:3007']
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    <<: *service-base
    build:
      context: ./apps/ai-service
    container_name: codementor-ai
    command: ['uv', 'run', '--no-sync', 'uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '3008']

volumes:
  kafka-data:
  keycloak-db-data:
